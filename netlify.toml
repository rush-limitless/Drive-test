[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/data/dashboard.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
