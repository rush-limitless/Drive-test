name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  spec-kit-check:
    name: Spec Kit validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-projet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mon-projet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run spec:check
        run: npm run spec:check

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-projet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/backend/requirements.txt pytest

      - name: Run pytest
        env:
          PYTHONPATH: src/backend
        run: python -m pytest src/backend/tests --capture=no --maxfail=1 -vv

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mon-projet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mon-projet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:electron
